[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emet"
version = "0.3.3"  # Keep in sync with src/emet/version.py
description = "Stretch Python API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Hello Robot Inc.", email = "support@hello-robot.com" },
]
keywords = ["robotics", "stretch", "hello-robot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.6",
    "torchvision",
    "torchaudio",
    "pyyaml",
    "pyzmq",
    "numpy<2",
    "numba",
    "opencv-python",
    "scipy",
    "matplotlib",
    "trimesh>=3.10.0",
    "yacs",
    "scikit-image>=0.21.0",
    "sophuspy",
    "pin",
    "pynput",
    "pyusb",
    "schema",
    "overrides",
    "wget",
    "openai>=1.88.0",
    "google-genai",
    "ultralytics==8.3.161",
    "hello-robot-stretch-urdf",
    "pyrealsense2",
    "urchin",
    "rerun-sdk>=0.21.0,<0.23.0",
    "sentencepiece",
    "gitpython",
    "hydra-core",
    "timm>1.0.0",
    "huggingface_hub[cli]>=0.24.7",
    "open-clip-torch>=2.32.0",
    "transformers>=4.50.0",
    "retry",
    "qwen_vl_utils",
    "bitsandbytes",
    "triton>=2.3.1",
    "accelerate>=1.5.0",
    "einops",
    "protobuf",
    "pyliblzfse",
    "webp>=0.3.0",
    "termcolor",
    "librosa",
    "PyAudio>=0.2.14",
    "openai-whisper",
    "pydub",
    "simpleaudio",
    "scikit-fmm",
    "open3d",
    "click>=8.1.8",
]

[project.scripts]
emet = "emet.cli:main"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-timeout",
    "ruff>=0.8.0",
    "mypy",
    "lark",
]
discord = [
    "discord.py",
    "python-dotenv",
]
# sim: empty by default so uv sync works without third_party. For emet serve robocasa / robocasa list:
#   emet install sim   (clones third_party/robosuite, robocasa)
#   python scripts/enable_sim_pyproject.py
#   uv sync -e sim
sim = []
hand_tracker = [
    "mediapipe",
    "webcam",
]
dynamem = [
    "SAM-2",
]

[tool.uv]
# Robocasa 0.2 pins numpy==1.23.3 and numba==0.56.4; dynamem/SAM-2 need numpy>=1.24.4.
# Override so both sim and dynamem resolve; numba>=0.58.1 works with numpy 1.24+ and avoids "initialization of _internal failed".
# mujoco>=3.3.0 forces use of third_party/robocasa (which has mujoco>=3.3.0); PyPI robocasa pins mujoco==3.2.6 and would conflict.
override-dependencies = ["numpy>=1.24.4,<2", "numba>=0.58.1", "mujoco>=3.3.0"]

[tool.uv.sources]
"SAM-2" = { path = "third_party/segment-anything-2", editable = true }
# Uncomment after running scripts/install_simulation.sh, then run scripts/enable_sim_pyproject.py
# robosuite = { path = "third_party/robosuite", editable = true }
# robocasa = { path = "third_party/robocasa", editable = true }

[project.urls]
Homepage = "https://github.com/hello-robot/stretchpy"
Repository = "https://github.com/hello-robot/stretchpy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emet = [
    "config/**/*.yaml",
    "perception/*.tsv",
    "assets/**/*",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]
# Exclude third_party from lint/format (vendored and forks)
exclude = ["third_party"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
addopts = "-ra -q"
markers = [
    "timeout: timeout for test in seconds (pytest-timeout)",
]
