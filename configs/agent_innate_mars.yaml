# Innate Mars agent preset (unified nested config).
# Discord house chat + explore: see docs/robots/innate_mars_hardware.md
#   export DISCORD_TOKEN=...
#   # After: emet connect save … --name herman --config configs/agent_innate_mars.yaml
#   # Caliban: prefer unified Qwen2-VL-7B on :8000 for text + captions
#   #   (./scripts/deploy_caliban_vl.sh --profile unified-7b). dual-2b keeps text
#   #   :8000 CausalLM + VL :8001 (smaller). See docs/llm_serve.md.
#   uv run emet run agent --connection herman
extends: configs/emet/default.yaml

robot: innate_mars
connection: herman

agent:
  name: Herman
  # Tool-router + (when unified-7b) caption VLM on caliban :8000.
  # Override with ``--llm qwen35-4B`` for local, or ``EMET_OPENAI_MODEL=…`` to label the remote id.
  llm: openai@http://caliban:8000/v1
  # Load caption/EQA path (remote VLM via mapping.eqa.vl_endpoint when set).
  eqa: true
  discord: true
  # Single Dynagraph memory plug-in on the voxel map (not open_vocab + GraphEQA).
  memory_backend: dynagraph

embodied_agent:
  # Builder flags are coerced from agent.memory_backend; keep OV off for Discord VRAM.
  open_vocab_scene_graph:
    enabled: false
    config_name: default_scene_graph
  graph_eqa_memory:
    enabled: true
    use_instance_graph: true
    use_sensor_perception: true
    graph_object_fusion:
      enabled: true
      spatial_merge_xy_m: 0.42
      embedding_min_cosine: 0.62
      bounds_3d_iou_min: 0.08

mapping:
  # Caption / EQA frames → same caliban OpenAI serve as text when using unified-7b
  # (Qwen2-VL-7B on :8000). For dual-2b, point at :8001 instead (or EMET_VL_ENDPOINT).
  eqa:
    vl_endpoint: openai@http://caliban:8000/v1
  # Dynagraph/eval VL sizing (used when vl_endpoint is unset / local weights).
  eqa_vl:
    model_size: "4B"
