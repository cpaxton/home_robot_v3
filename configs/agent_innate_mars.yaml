# Innate Mars agent preset (unified nested config).
# Discord house chat + explore: see docs/robots/innate_mars_hardware.md
#   export DISCORD_TOKEN=...
#   uv run emet run agent --connection herman --config configs/agent_innate_mars.yaml --name Herman
extends: configs/emet/default.yaml

robot: innate_mars

agent:
  # Load Qwen3-VL captioner for describe_scene / memory QA (Discord “what do you see?”).
  eqa: true
  discord: true

embodied_agent:
  open_vocab_scene_graph:
    enabled: true
    config_name: default_scene_graph
  graph_eqa_memory:
    enabled: true
    use_instance_graph: true
    use_sensor_perception: true
    graph_object_fusion:
      enabled: true
      spatial_merge_xy_m: 0.42
      embedding_min_cosine: 0.62
      bounds_3d_iou_min: 0.08

mapping:
  # Dynagraph/eval VL sizing (separate from agent --eqa / mapping.eqa captioner).
  eqa_vl:
    model_size: "4B"
