# Canonical unified EMET config (repo root).
# Override path: ``EMET_CONFIG=/path/to.yaml`` or ``--config PATH``.
# Dot overrides: ``--set mapping.depth_source=auto`` / ``-O agent.eqa=true``.

defaults:
  - mapping: package://emet/config/mapping/default.yaml
  - agent: package://emet/config/agent/default.yaml
  - rerun: package://emet/config/agents/default_rerun.yaml
  - eval: package://emet/config/eval/default.yaml

robot: null
connection: null

sim: null
sim_config: null

# Grounded Graph Agent rollout axes. These are inert legacy-compatible defaults;
# HM-EQA launches freeze their effective values in OUT/run_manifest.json.
mapping:
  eqa:
    agentic_decision_policy: "legacy"
    graph_evidence_mode: "off"
    room_history_mode: "off"
    room_policy: "canonical"
    room_target_hints: true
    room_stamp_investigate: false
    room_clustering:
      backend: proximity
    # off=no durable rows/history; shadow=collect but hide; agent=expose grounded
    # recent outcomes, loop flags, per-place summaries, and global attempt rows.
    attempt_ledger_mode: "off"
    # Static-benchmark retry policy: shadow=measure only; enforce=suppress an
    # equivalent no-progress action while its target-local state is unchanged.
    action_progress_mode: "off"
    variant_id: "legacy"

embodied_agent: {}

robots:
  stretch: {}
  innate_mars:
    mapping:
      depth_source: auto
      da3_stereo: true
      local_radius: 0.85
      max_depth: 3.2
      # Cap DA3 far outliers (effective clip was ~max_depth+1 ≈ 4.2 without this).
      da3_clip_max_m: 3.5
      # Drop textureless sky / ceiling rows that become phantom vertical sheets.
      da3_ignore_sky_fraction_top: 0.14
      # Mild post-DA3 cleanup for herman spurious mid-air points. Disable with 0 if thin
      # furniture is over-pruned (was fully off; 3/8 historically eroded real structure).
      filters:
        depth_speckle_open_kernel: 3
        depth_speckle_open_iterations: 1
        voxel_pcd_dbscan_min_samples: 6
        derivative_filter_threshold: 0.15
      graph_object_fusion:
        enabled: true
        spatial_merge_xy_m: 0.48
        min_centroid_dist_m: 0.65
        bounds_3d_iou_min: 0.0
        bounds_3d_iou_merge_min: 0.40
        embedding_min_cosine: 0.0
        embedding_blend_alpha: 0.35
        require_label_match: false
        require_label_match_for_instances: true
        max_candidates: 64
        match_xy_m: 0.55
        fallback_spatial_merge_xy_m: 0.55
        instance_min_confidence: 0.12
        instance_min_mask_points: 25
    zmq:
      allow_missing_depth: true
  rby1: {}
  galaxea_r1: {}
  xlerobot: {}
