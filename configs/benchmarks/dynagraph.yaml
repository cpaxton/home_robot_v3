# Canonical Dynagraph profiles for paper benchmarks and ``emet run dynagraph``.
# Loaded by ``emet.eval.benchmark_dynagraph``; do not duplicate merge/staleness in harness code.
#
# Interactive default (0.45 m merge, staleness 256) also lives in ``dynav_config.yaml`` so
# ``get_parameters("dynav_config.yaml")`` matches ``emet run dynagraph``.
#
# Memory backends: dynamem (voxels) | static_graph (object graph, no lifecycle) |
# dynagraph (merge + staleness + extras) | ground_truth (oracle).
# Legacy method/backend id ``graph_eqa`` and profile ``graph_eqa_baseline`` alias to
# ``static_graph`` (see ``emet.eval.memory_backends``).

profiles:
  interactive:
    description: "Live exploration and long-horizon runs (``emet run dynagraph`` default)."
    dynagraph_merge_xy_m: 0.45
    dynagraph_staleness_horizon: 256

  smoke:
    description: "No merge/staleness — fast CI regression (not a paper method row)."
    dynagraph_merge_xy_m: 0.0
    dynagraph_staleness_horizon: 0

  eqa:
    description: "Paper EQA benchmarks (SQA3D tuned, short episodes)."
    dynagraph_merge_xy_m: 0.45
    dynagraph_staleness_horizon: 256
    graph_eqa_extract:
      navigation_samples_max: 48

  unified_eqa:
    description: >
      Shared Dynagraph EQA profile for Habitat HM-EQA (and aligned SQA3D when desired):
      same merge/staleness as interactive/eqa so long-horizon instance memory works.
      Zero-merge is only for smoke CI and static_graph paper rows.
    dynagraph_merge_xy_m: 0.45
    dynagraph_staleness_horizon: 256
    graph_eqa_extract:
      navigation_samples_max: 48

  find_phase:
    description: "OVMM find-phase localization — tighter merge reduces centroid error."
    dynagraph_merge_xy_m: 0.15
    dynagraph_staleness_horizon: 256

  static_graph:
    description: >
      Static object-graph baseline (GraphEQA-inspired reimplementation) —
      merge/staleness disabled; no Dynagraph lifecycle extras.
    dynagraph_merge_xy_m: 0.0
    dynagraph_staleness_horizon: 0

# Harness-specific controller flags (task-dependent; not graph-memory parameters).
# ``apply_dynagraph_harness`` applies ``profile`` merge/staleness then method kwargs into
# ``parameters.dynagraph_harness`` for ``DynagraphController``.
harness:
  habitat_eqa:
    # Default profile for dynagraph method only; static_graph overrides below.
    profile: unified_eqa
    dynagraph:
      memory_summary: true
      mcq_debias: false
      explore_when_uncovered: conservative
      siglip_grounding: true
      use_instance_graph: false
      manipulation_only: true
    static_graph:
      # GraphEQA-inspired static row: no merge/staleness, no Dynagraph extras.
      profile: static_graph
      memory_summary: false
      mcq_debias: false
      explore_when_uncovered: "off"
      siglip_grounding: false
      use_instance_graph: false
      manipulation_only: true
  habitat_ovmm_find:
    dynagraph:
      profile: find_phase
      eqa: false
      use_instance_graph: true
      manipulation_only: false
    static_graph:
      profile: static_graph
      eqa: false
      use_instance_graph: true
      manipulation_only: false
    ground_truth:
      profile: find_phase
      eqa: false
      use_instance_graph: true
      manipulation_only: false
  ovmm_find_phase:
    dynagraph:
      profile: find_phase
      use_instance_graph: true
      manipulation_only: false
      eqa: false
    static_graph:
      profile: static_graph
      use_instance_graph: true
      manipulation_only: false
      eqa: false
    ground_truth:
      profile: find_phase
      use_instance_graph: true
      manipulation_only: false
      eqa: false
  sqa3d:
    dynagraph:
      profile: eqa
      use_instance_graph: false
      manipulation_only: true
      eqa: true
      prompt_variant: sqa3d
      sqa3d_allow_partial_graph: true
      memory_summary: false
      mcq_debias: false
      explore_when_uncovered: "off"
      siglip_grounding: false
  dynamic_explore:
    dynagraph:
      profile: interactive
      memory_summary: true
      mcq_debias: true
      explore_when_uncovered: "on"
      siglip_grounding: true
    static_graph:
      profile: static_graph
      memory_summary: false
      mcq_debias: false
      explore_when_uncovered: "off"
