# Legacy HM-EQA location-letter override policy (pre-2026-08-13 full-113 sweep).
#
# ⚠️ PARTIAL REFERENCE ONLY — do NOT pass this file to `--dynav-config` /
# `--config`. It contains only the eqa: overrides; a full config (robot,
# mapping, sim, ...) is required to load. Use the env-var / --set forms below.
#
# Reproduces the behavior recorded for `subset_paper113_20260813_104004`
# (dynagraph 44.2% / static_graph 37.2%). The post-sweep default in
# `src/emet/config/dynav_config.yaml` gates the equipment-distance override on
# VLM confidence (recovers ~10 pp offline; see scripts/hmeqa_override_ab.py).
#
# To restore legacy behavior for an A/B without editing the default config:
#   env EMET_EQA_LOCATION_OVERRIDE_EQUIP_GATE=0 \
#       EMET_EQA_LOCATION_OVERRIDE_IMAGE_GATE=0 \
#       ./scripts/run_hmeqa_paper113_h2h.sh
# or on CLI apps: `--set eqa.location_override_equip_gate=false`.
#
# Offline comparison (no GPU):
#   uv run python scripts/hmeqa_override_ab.py \
#     ~/.cache/habitat_eqa/results/subset_paper113_*_dynagraph_qwen3_vl.jsonl
eqa:
  # false = equipment-distance guess may override a confident VLM A–D (legacy).
  location_override_equip_gate: false
  # false = image-landmark override also fires on confident VLM letters (legacy).
  location_override_image_gate: false
