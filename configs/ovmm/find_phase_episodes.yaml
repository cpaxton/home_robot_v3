# OVMM-inspired find-phase episodes (FindObj / FindRec memory localization).
# See docs/ovmm_find_phase_benchmark.md and scripts/eval_ovmm_find_phases.py

episodes:
  - id: default_table_s0
    tier: S0
    sim: configs/sim/default_table_stretch.yaml
    object: red cylinder
    start_recep: table
    goal_recep: table
    success_radius_m: 0.30
    explore_steps: 0

  - id: default_table_s0_blue_cube
    tier: S0
    sim: configs/sim/default_table_stretch.yaml
    object: blue cube
    start_recep: table
    goal_recep: table
    success_radius_m: 0.30
    explore_steps: 0

  - id: default_table_s0_distinct_recep
    tier: S0
    sim: configs/sim/default_table_stretch.yaml
    object: red cylinder
    start_recep: table
    goal_recep: blue cube
    success_radius_m: 0.30
    explore_steps: 0

  - id: robocasa_pp_s1
    tier: S1
    sim: configs/sim/robocasa_pick_place_stretch.yaml
    object: jar
    object_gt_body: obj_main
    start_recep: counter
    goal_recep: cab
    success_radius_m: 0.50
    explore_steps: 0

  - id: robocasa_pp_s1_explore5
    tier: S1
    sim: configs/sim/robocasa_pick_place_stretch.yaml
    object: jar
    object_gt_body: obj_main
    start_recep: counter
    goal_recep: cab
    success_radius_m: 0.50
    explore_steps: 8

  - id: molmo_ithor_s2_idx0
    tier: S2
    # iTHOR train index 0 is a kitchen (bowl/apple/vase/cabinets), not chair/table/sofa.
    sim: configs/sim/molmospaces_ithor_train_stretch_0.yaml
    object: bowl
    start_recep: cabinet
    goal_recep: microwave
    object_gt_body: bowl_6befd62f08fd322391939c2b44d3f839_1_1_0
    success_radius_m: 0.75
    explore_steps: 0

  - id: molmo_ithor_s2_idx0_explore15
    tier: S2
    sim: configs/sim/molmospaces_ithor_train_stretch_0.yaml
    object: bowl
    start_recep: cabinet
    goal_recep: microwave
    object_gt_body: bowl_6befd62f08fd322391939c2b44d3f839_1_1_0
    success_radius_m: 0.75
    explore_steps: 15

  - id: molmo_ithor_s2_idx1
    tier: S2
    sim: configs/sim/molmospaces_ithor_train_1.yaml
    object: chair
    start_recep: table
    goal_recep: sofa
    success_radius_m: 0.75
    explore_steps: 0

  - id: molmo_ithor_s2_idx2
    tier: S2
    sim: configs/sim/molmospaces_ithor_train_2.yaml
    object: chair
    start_recep: table
    goal_recep: sofa
    success_radius_m: 0.75
    explore_steps: 0

  # ---------------------------------------------------------------------------
  # Fast agentic gate (rby1): no Stretch Realsense head-sweep tax. Prefer these
  # for routine OVMM find validation; Stretch episodes stay paper / overnight.
  # See docs/experiments/ovmm_agentic_find_teleport.md and
  # scripts/run_ovmm_find_recep_slice.sh (PROFILE=smoke).
  # ---------------------------------------------------------------------------
  - id: default_table_rby1_s0_distinct_recep
    tier: S0
    sim: configs/sim/default_table_rby1.yaml
    object: red cylinder
    start_recep: table
    goal_recep: blue cube
    success_radius_m: 0.30
    explore_steps: 0

  - id: robocasa_rby1_pp_s1
    tier: S1
    sim: configs/sim/robocasa_pick_place_rby1.yaml
    object: jar
    object_gt_body: obj_main
    start_recep: counter
    goal_recep: cab
    success_radius_m: 0.50
    # No scene cache exists for the rby1 kitchen; rotate-only mapping leaves a
    # ~1 m² disk and find cannot localize a jar. Live agentic explore (the
    # unified OVMM mapping path) is the coverage that makes this leg runnable;
    # 8 hops (~4 m) still stopped short of the counter, so budget 20.
    explore_steps: 20
