# Kinematic asset/perception diagnostic, NOT a navigation or dynamics benchmark.
# rby1 currently resolves to the Galaxea R1 proxy MJCF.
robot: rby1
base_xyt: [0.0, 0.8, -1.5707963267948966]
head_pan: 0.0
head_tilt: -0.6108652381980153
camera: zed_camera
image_size: [480, 640]
table_position: [0.0, -1.0, 0.4]
table_size: [0.6, 0.5, 0.4]
targets:
  - body: object1
    query: blue cube
    position: [-0.22, -0.8, 0.88]
    size: [0.08, 0.08, 0.08]
    rgba: [0.1, 0.2, 0.9, 1.0]
  - body: object2
    query: red cylinder
    position: [0.22, -0.8, 0.88]
    size: [0.08, 0.08, 0.08]
    rgba: [0.9, 0.1, 0.1, 1.0]
negative_queries: [green mug]
# Incremental live-bridge diagnostic: known free space in front of the table.
live_probe:
  hold_seconds: 10
  hold_xy_tolerance_m: 0.03
  # Precision diagnostic, explicitly stricter than normal bridge arrival defaults.
  waypoint_xy_tolerance_m: 0.02
  yaw_tolerance_rad: 0.03
  route:
    - [0.0, 0.8, -1.3962634015954636]  # +10 degree turn
    - [0.0, 0.8, -1.5707963267948966]  # restore view
    - [0.0, 0.6, -1.5707963267948966]  # 20 cm toward table
    - [0.0, 0.8, -1.5707963267948966]  # return
