# Full OVMM episodes (FindObj + Pick + FindRec + Place).
# Same schema as find_phase_episodes.yaml; use distinct start/goal receps where possible.
# See docs/ovmm_full_benchmark.md and scripts/eval_ovmm_full.py

episodes:
  - id: default_table_s0_distinct_recep
    tier: S0
    sim: configs/sim/default_table_stretch.yaml
    object: red cylinder
    start_recep: table
    goal_recep: blue cube
    success_radius_m: 0.30
    explore_steps: 0

  # Stretch MuJoCo and robosuite (rby1) both advertise sim_set_body_pose for manip_mode=sim.
  - id: robocasa_pp_s1
    tier: S1
    sim: configs/sim/robocasa_pick_place_stretch.yaml
    object: obj
    object_gt_body: obj_main
    start_recep: counter
    goal_recep: cab
    success_radius_m: 0.50
    explore_steps: 0

  # MolmoSpaces iTHOR + rby1: GT placements name mesh child …_1_1_0; teleport walks to freejoint …_1_0_0.
  - id: molmo_ithor_rby1_s2_bowl_pp
    tier: S2
    sim: configs/sim/molmospaces_ithor_train_0.yaml
    object: bowl
    object_gt_body: bowl_6befd62f08fd322391939c2b44d3f839_1_1_0
    start_recep: cabinet
    goal_recep: microwave
    success_radius_m: 0.75
    explore_steps: 0

  # ---------------------------------------------------------------------------
  # RoboCasa TAMP floor pick/place: the object starts on the floor and must be
  # picked off the floor and placed on a counter / cabinet (or just found while
  # exploring the room). floor_object drops the GT body to z≈0 before pick.
  # mcts manip_mode drives the real arm (kinematic); sim/oracle use teleport.
  # ---------------------------------------------------------------------------

  # Floor object -> counter, kinematic MCTS path (rby1 / Galaxea arm).
  - id: robocasa_rby1_floor_to_counter_mcts
    tier: S1
    sim: configs/sim/robocasa_pick_place_rby1.yaml
    object: obj
    object_gt_body: obj_main
    start_recep: floor
    goal_recep: counter
    success_radius_m: 0.60
    explore_steps: 0
    floor_object: true
    floor_z_m: 0.02
    manip_mode: mcts

  # Floor object -> cabinet, teleport oracle (upper-bound reference for MCTS).
  - id: robocasa_sourccey_floor_to_cab_sim
    tier: S1
    sim: configs/sim/robocasa_pick_place_sourccey.yaml
    object: obj
    object_gt_body: obj_main
    start_recep: floor
    goal_recep: cab
    success_radius_m: 0.60
    explore_steps: 0
    floor_object: true
    floor_z_m: 0.02
    manip_mode: sim

  # Counter-top object -> cabinet, kinematic MCTS path (new official URDF arms reach
  # table/counter height; the arm's workspace bottoms out around z≈0.36 m, so floor
  # objects are out of reach — use the counter pick as the sourccey kinematic row).
  - id: robocasa_sourccey_counter_to_cab_mcts
    tier: S1
    sim: configs/sim/robocasa_pick_place_sourccey.yaml
    object: obj
    object_gt_body: obj_main
    start_recep: counter
    goal_recep: cab
    success_radius_m: 0.60
    explore_steps: 0
    manip_mode: mcts

  # Floor object -> counter, stretch teleport reference.
  - id: robocasa_stretch_floor_to_counter_sim
    tier: S1
    sim: configs/sim/robocasa_pick_place_stretch.yaml
    object: obj
    object_gt_body: obj_main
    start_recep: floor
    goal_recep: counter
    success_radius_m: 0.60
    explore_steps: 0
    floor_object: true
    floor_z_m: 0.02
    manip_mode: sim

  # Floor-object "explore the room" find-only episode (no manip): the robot must
  # navigate and localize an object that fell on the floor.
  - id: robocasa_floor_find_only_explore
    tier: S1
    sim: configs/sim/robocasa_pick_place_stretch.yaml
    object: obj
    object_gt_body: obj_main
    start_recep: floor
    goal_recep: floor
    success_radius_m: 0.60
    explore_steps: 5
    floor_object: true
    floor_z_m: 0.02
    manip_mode: skip
