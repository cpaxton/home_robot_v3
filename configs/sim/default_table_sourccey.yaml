# Default MuJoCo table scene (scene_environment.xml) + Sourccey — no Robocasa, no MolmoSpaces merge.
# Table objects sit at z≈0.6 m (within Sourccey arm reach; floor objects are not).
# Mk.V uses +X forward and RobotSpec.tamp_approach=front (yaw=-pi/2).
kind: default_mujoco
robot: sourccey
headless: true
port_offset: 0
seed: 0
