[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emet-molmospaces"
version = "0.1.0"
description = "Thin wrapper for MolmoSpaces (scenes + rby1 robot); depends on emet and molmo-spaces."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "emet",
    "molmo-spaces",
    "mujoco>=3.4",
    "numpy>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
emet-molmospaces = "emet_molmospaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
