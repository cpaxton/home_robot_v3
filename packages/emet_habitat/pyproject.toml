[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emet-habitat"
version = "0.1.0"
description = "Habitat-Sim EQA harness for emet GraphEQA / Dynagraph evaluation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.11"
# habitat-sim is NOT on PyPI for Linux. Install via ./scripts/install_habitat.sh (micromamba + aihabitat-nightly).
# emet is installed with --no-deps from the repo root; see requirements-pip.txt for pip-only deps.
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
emet-habitat = "emet_habitat.cli:main"

[tool.setuptools.packages.find]
where = ["."]
