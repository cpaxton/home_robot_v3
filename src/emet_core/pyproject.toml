[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emet-core"
version = "0.3.3"
description = "Core runtime for Emet: server, motion, utils (robot and bridge backends)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24.4,<2",
    "scipy",
    "pyzmq",
    "opencv-python",
    "sophuspy",
    "pin",
    "yacs",
    "hydra-core",
    "pyyaml",
    "termcolor",
    "overrides",
    "schema",
    "trimesh>=3.10.0",
    "numba>=0.58.1",
    "omegaconf",
    "pyliblzfse",
    "Pillow",
]

[project.optional-dependencies]
audio = ["piper-tts"]
dev = ["pytest", "ruff>=0.8.0"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
emet = ["config/**/*.yaml", "config/**/*.json", "config/control/*.yaml", "config/**/teleop*.yaml"]
