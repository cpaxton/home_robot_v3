# Default chat / tool agent options for ``emet run agent``.
llm: qwen35-4B
eqa: false
share_memory_vllm: true
discord: true
prompt: simple
device: cuda
# Tool-call JSON is short; 1024 made HF generate crawl when the model rambled.
max_tokens: 256
# Interactive memory stack (mutually exclusive graph plug-in):
# dynagraph (default), graph_eqa, open_vocab, or dynamem.
memory_backend: dynagraph
# Sim pick/place: teleport (GT body snap) or kinematic (IK + joint traj + attach).
# Override with EMET_MANIP_MODE. Visual-servo Stretch still wins when enabled.
manip_mode: teleport
# Arm collision filter for kinematic mode: none | voxel (agent map). EMET_MANIP_COLLISION.
manip_collision: none
# Joint-space path between IK start/goal: rrt_connect (default) | rrt | linear. EMET_MANIP_PLANNER.
manip_planner: rrt_connect
