# Dynagraph benchmark question bank (real LLM EQA scoring via emet eval-dynagraph).
# expected_tokens: all must appear in answer text (case-insensitive substring).
# gt_body_key: optional sim_object_placements body for spatial check when cited_xyz present.

environments:
  - env: default_table
    questions:
      - id: colors_on_table
        question: "What colors are the objects on the table?"
        expected_tokens: ["red", "blue"]
      - id: red_object
        question: "Is there a red object visible?"
        expected_tokens: ["red"]

  - env: robocasa_seed0
    questions:
      - id: sink_location
        question: "Where is the sink?"
        expected_tokens: ["sink"]
        gt_body_key: sink_main
        max_xy_error_m: 1.2
      - id: counter_contents
        question: "What is on the counter?"
        expected_tokens: ["counter"]

  - env: robocasa_seed1
    questions:
      - id: sink_location
        question: "Where is the sink?"
        expected_tokens: ["sink"]
        gt_body_key: sink_main
        max_xy_error_m: 1.2
      - id: stove_location
        question: "Where is the stove?"
        expected_tokens: ["stove"]

  - env: robocasa_seed2
    questions:
      - id: fridge_location
        question: "Where is the refrigerator?"
        expected_tokens: ["fridge", "refrigerator"]
      - id: counter_contents
        question: "What is on the counter?"
        expected_tokens: ["counter"]

  - env: robocasa_seed0_world_change
    questions:
      - id: object_pre
        phase: pre
        question: "Where is the pick-place object on the counter?"
        expected_tokens: ["counter"]
        gt_body_key: obj_main
        max_xy_error_m: 1.0
      - id: object_post
        phase: post
        question: "Where is the pick-place object now?"
        expected_tokens: ["counter", "cabinet", "kitchen"]
        gt_body_key: obj_main
        max_xy_error_m: 1.5

  - env: molmospaces_ithor0
    questions:
      - id: room_furniture
        question: "What loose objects are on the kitchen counter?"
        expected_tokens: ["bowl", "apple", "vase"]
      - id: microwave_location
        question: "Where is the microwave?"
        expected_tokens: ["microwave"]

  - env: molmospaces_ithor1
    questions:
      - id: room_furniture
        question: "What furniture is in this room?"
        expected_tokens: ["chair", "table"]
      - id: bed_location
        question: "Where is the bed?"
        expected_tokens: ["bed"]

  - env: molmospaces_ithor2
    questions:
      - id: room_furniture
        question: "What furniture is in this room?"
        expected_tokens: ["chair", "sofa"]
      - id: tv_location
        question: "Where is the television?"
        expected_tokens: ["tv", "television"]
