# Hyperparameters for DynaMem

# Encoder setup
# Encoder is used to compute per-object embeddings.
encoder: "siglip"
open_vocab_category_map_file: example_cat_map.json

# Sparse Voxel Map parameters
voxel_size: 0.1
obs_min_height: 0.2  # Ignore things less than this high when planning motions
obs_max_height: 1.5  # Ignore things over this height (eg ceilings)
obs_min_density: 5  # This many points makes it an obstacle
exp_min_density: 1
min_points_per_voxel: 15  # Drop things below this density per voxel

# Padding
pad_obstacles: 2  # Add this many units (voxel_size) to the area around obstacles
min_pad_obstacles: 1  # Do not pad LESS than this amount, for safety.

# Grid-edge barrier on the 2D map (Dynamem get_2d_map). Default off; set obstacle_barrier_cells: 30 for legacy behavior.
map_boundary:
  obstacle_barrier_cells: 0
  history_penalty_cells: 0

local_radius: 0.5  # Area around the robot to mark as explored (kind of a hack)
add_local_every_step: False
remove_visited_from_obstacles: False
min_depth: 0.25
max_depth: 2.5

# Depth for voxel mapping: ``sensor`` (ZMQ/real depth), ``da3`` (Depth Anything 3 from RGB), ``auto`` (sensor if present else DA3).
# depth-anything-3 ships with default ``uv sync``; ZMQ clients may need ``allow_missing_depth`` when the server omits depth.
# ``da3_process_res``: lower = faster; default 378 with DA3-SMALL when depth uses DA3 / auto fallback.
# With ``depth_source: sensor`` the stack never loads DA3; these presets still apply if you switch to ``da3``/``auto``.
# ``da3_use_amp``: omit to enable CUDA autocast automatically when ``da3_device``/controller device is CUDA; set ``false`` to force FP32.
# ``da3_infer_every_n`` / ``da3_stereo`` default to throughput-friendly values (reuse depth; monocular). Set ``da3_stereo: true`` for two-view DA3 when you need it.
depth_source: sensor
da3_model_id: depth-anything/DA3-SMALL
da3_process_res: 378
da3_infer_every_n: 2
da3_stereo: false
# Heavy perception (YoloE + SigLIP + instance + graph) every N updates; occupancy
# still updates every frame so navigation stays current. 1 = always (old behavior).
perception_every_n: 2
# da3_use_amp: true   # optional override; omit for auto on CUDA
# da3_torch_compile: false  # experimental
# --- Quality-first overrides (slower): ``da3_model_id: depth-anything/DA3METRIC-LARGE``, ``da3_process_res: 504``, ``da3_stereo: true``, ``da3_infer_every_n: 1``.

# EQA (memory Q&A when using emet run agent --eqa / dynagraph / graph-eqa-habitat).
# Default: Qwen3-VL-8B int4 (HM-EQA bake-off winner on 24 GB GPU; see docs/habitat/vlm_bakeoff.md).
# vl_family: qwen3_vl | qwen3_5 | qwen2_5_vl | gemma4 — set vl_hf_model_id to override the checkpoint.
# qwen3_5 = natively-multimodal Qwen3.5 (default Qwen/Qwen3.5-9B, thinking disabled).
# Agent: ``--llm qwen3-vl-eqa --eqa`` or ``--llm gemma4-vl-eqa --eqa`` override vl_family via agent YAML.
eqa:
  backend: qwen_vl
  vl_family: qwen3_vl
  vl_model_size: 8B
  vl_max_tokens: 512
  vl_quantization: int4
  vl_hf_model_id: Qwen/Qwen3-VL-8B-Instruct
  vl_cache_system_prefix: true
  vl_max_cached_prefixes: 1
  # Cap RGB fed to the VL (longest side). 0 = no resize. Optional pixel budget via vl_image_max_pixels.
  vl_image_max_side: 512
  vl_image_max_pixels: 0
  # Agentic explore/navigate/verify/answer loop (post-explore + world-change EQA).
  agentic_verify: false
  agentic_max_tool_rounds: 8
  agentic_max_nav_steps: 8
  agentic_verify_min_sim: 0.28
  # Versioned Grounded Graph Agent rollout axes. Defaults preserve the legacy
  # decision path; HM-EQA freezes these in run_manifest.json for same-commit A/Bs.
  agentic_decision_policy: "legacy"  # legacy | grounded_v2
  graph_evidence_mode: "off"  # off | shadow | agent
  room_history_mode: "off"  # off | shadow | agent
  room_target_hints: true
  room_stamp_investigate: false
  attempt_ledger_mode: "off"  # off | shadow | agent
  variant_id: "legacy"
  # Action-outcome ledger — default off (paper pins unchanged). EMET_EQA_ATTEMPT_LEDGER=1.
  # Docs: docs/attempt_ledger.md
  # attempt_ledger: false
  # attempt_ledger:
  #   enabled: true
  #   max_records: 512
  #   persist_absent_claims: false
  # VLM router picks tools via the shared JSON tool-calling contract; false = deterministic fallback only.
  agentic_vlm_router: true
  # Room identity / leave hint for agentic explore (ablation):
  #   canonical — closed vocab + question_target_rooms mismatch hint
  #   llm — free-text current_room + router in_target_area
  # Frontier VLM always re-asks the Question (no frozen question_area).
  # Override: EMET_EQA_ROOM_POLICY=canonical|llm
  room_policy: canonical
  collect_agentic_trace: false
  # Gemma int4 VRAM tiers (nvidia-smi memory.free MiB) when vl_hf_model_id unset and vl_family=gemma4
  vram_mib_tier_gemma_e4b: 12000
  vram_mib_tier_gemma_e2b: 7000
  gemini_model: gemini-2.5-flash
  # Habitat HM-EQA (runner setdefault when unset; see docs/habitat/usage.md):
  # habitat_perfect_nav: true
  # habitat_explore_frontiers: true
  # image_nav_min_approach_m: 0.35

# Object detection (instance memory / graph proposals). See mapping/default.yaml for the two-knob note:
# confidence_threshold = proposals (eval before raising); describe_* = chat-only and safe to tighten.
detection:
  module: "owlsam"
  category_map_file: example_cat_map.json
  use_detic_viz: False
  confidence_threshold: 0.02
  describe_use_detector_fallback: false
  describe_confidence_threshold: 0.30
  describe_use_curated_vocab: true
  describe_max_labels: 12

# Point cloud cleanup
filters:
  # Use a simple convolutional filter
  smooth_kernel_size: 3
  # smooth_kernel_size: 4
  # smooth_kernel_size: 0
  use_median_filter: True
  median_filter_size: 4
  # median_filter_size: 2
  median_filter_max_error: 0.01
  use_derivative_filter: True
  derivative_filter_threshold: 0.2
  # use_voxel_filter: True

# Motion convergence (StretchZmqClient; same as default_planner.yaml)
motion:
  moving_threshold: 0.01
  angle_threshold: 0.1
  min_steps_not_moving: 2
  joint_tolerance:
    arm: 0.02
    base_x: 0.02
    lift: 0.02
    wrist_roll: 0.1
    wrist_pitch: 0.1
    wrist_yaw: 0.1
    head_pan: 0.01
    head_tilt: 0.01
  joint_thresholds:
    head_not_moving_tolerance: 1.0e-4
    gripper_open_threshold: 0.3

# Exploration
agent:
  realtime:
    # This is the distance to pose graph nodes
    matching_distance: 0.5
    # This was 0.05 in Atharva's experiments
    # It is how close lidar spins have to be to be considered the same
    temporal_threshold: 0.1
    # Maximum number of observations to match with a pose graph node
    maximum_matched_observations: 10
    # Camera pose match threshold. Intuitively, there should already be a observation very similar to the current observation in the pose graph.
    camera_pose_match_threshold: 0.1
  use_realtime_updates: False
  realtime_rotation_steps: 4
  in_place_rotation_steps: 8  # If you are not moving the head, rotate more often
  sweep_head_on_update: False
  # in_place_rotation_steps: 4
  # sweep_head_on_update: True

# Instance memory parameters
# These are mostly around making sure that we reject views of objects that are too small, too spotty, too unreliable, etc.
instance_memory:
  min_instance_thickness: 0.01
  min_instance_vol: 1e-6
  max_instance_vol: 10.0
  min_instance_height: 0.01
  max_instance_height: 1.8
  min_pixels_for_instance_view: 100
  min_percent_for_instance_view: 0.1
  # Should we remove the background from the instance views?
  # What doe this mean? If you have a view of a bottle on a table, should we remove the table?
  # It will have an effect on performance.
  mask_cropped_instances: False  # Should we remove the background from the instance views?
  # Optional: caption each instance view with a VLM (blip / qwen). Off by default (extra compute).
  use_captioning: False
  captioner: null  # set to "blip" or "qwen" to enable
  # Cross-frame association: match new detections to existing instances by 3D distance (de-duplication).
  use_association: False
  association_distance_m: 0.15
  move_threshold_m: 0.05
  matching:
    # Feature matching threshold for if something is considered a particular class
    # Set this value by experimting with:
    #   python -m emet.app.query --threshold 0.05
    # You can change the threshold to anything that makes sense.
    feature_match_threshold: 0.05

# TAMP parameters
guarantee_instance_is_reachable: True
# Show detected object instances as 3D boxes/icons in Rerun (sim and real)
use_instance_memory: True
use_scene_graph: True
scene_graph:
  max_near_distance: 0.3
  min_on_height: 0.05
  max_on_height: 0.2

# Navigation space - used for motion planning and computing goals.
motion_planner:
  step_size: 0.05
  rotation_step_size: 0.2
  simplify_plans: True
  shortcut_plans: True
  shortcut_iter: 100
  # When the start cell is marked occupied (pose noise / dilation), search this
  # many Chebyshev rings for a free A* start. Method default remains 4.
  start_escape_max_ring: 8
  # Parameters for frontier exploration using the motion planner.
  frontier:
    dilate_frontier_size: 2  # Used to shrink the frontier back from the edges of the world
    dilate_obstacle_size: 0  # Used when selecting goals and computing what the "frontier" is
    default_expand_frontier_size: 12  # margin along the frontier where final robot position can be
    # Distance away you search for frontier points
    min_dist: 0.1
    # Subsampling frontier space at this discretization
    step_dist: 0.2
  goals:
    # manipulation_radius: 0.45
    manipulation_radius: 0.55

# Trajectory following - how closely we follow intermediate waypoints
# These should be less strict than whatever parameters the low-level controller is using; this will
# make sure that the motions end up looking smooth.
trajectory_pos_err_threshold: 0.15
trajectory_rot_err_threshold: 0.5
trajectory_per_step_timeout: 3.0

# Qwen3.5 multimodal (EQA + keyword helpers for GraphEQA / DynaMem). Loaded once per process.
# Prefer a single locked size (default 9B int4). Set model_size: null to pick once from free VRAM via vram_mib_tier_*.
# Override: EMET_EQA_VL_MODEL_SIZE=4B
eqa_vl:
  model_size: "9B"
  quantization: int4
  vram_mib_tier_9b: 20000
  vram_mib_tier_4b: 11000
  keyword_max_tokens: 64
  graph_keyword_max_tokens: 64
  voxel_keyword_max_tokens: 20
  eqa_max_tokens: 512
  # Per-call decode cap for the EQA answer, separate from the client-wide eqa_max_tokens.
  # Raise for a verbose or reasoning-heavy VLM: too low and the model is cut off before
  # ``answer:`` and only a salvage re-ask saves the episode. Env: EMET_EQA_ANSWER_MAX_NEW_TOKENS.
  answer_max_new_tokens: 384
  eqa_max_images: 4
  # Unified approximate text-token budget for HISTORY + memory + SCENE_GRAPH in the
  # EQA user prompt (char/4 estimator). Truncation order: HISTORY → CONFIRMED_MEMORY →
  # edges → node labels. Env: EMET_EQA_PROMPT_MAX_TOKENS (0 disables).
  eqa_prompt_max_tokens: 2500
  # Legacy text block listing labels/coords for the same obs already attached as RGB.
  # Default off: SCENE_GRAPH + pixels are enough; the dump invited Caption: loops.
  # Env: EMET_EQA_INCLUDE_IMAGE_DESCRIPTIONS=1 to restore for A/B.
  include_image_descriptions: false
  # Cap SCENE_GRAPH object/frontier lines in the EQA prompt (full graph still in exports).
  # Blowups (e.g. HM-EQA q94) otherwise starve the VLM with 600+ nodes.
  eqa_max_graph_nodes: 48
  # Cap how many prior planning iterations are replayed in the prompt. Unbounded history
  # bloats the prompt and feeds the model its own repeated outputs (caption/action loops).
  eqa_max_history: 4
  # Spatial RAG: cluster keyword/preferred-obs neighborhoods into REGION blocks instead of
  # a flat top-K SCENE_GRAPH dump. Default off until fail-set validates score/image fixes;
  # enable for agentic context experiments (EMET_EQA_SPATIAL_RAG=1 also forces on).
  spatial_rag: false
  spatial_rag_radius_m: 2.5
  spatial_rag_max_regions: 6
  spatial_rag_max_nodes: 48
  verbose_hf: false

# GraphEQA: VLM object-name extraction (JSON-only; avoids CoT in node labels)
graph_eqa_extract:
  # Enough for a small JSON object after Qwen3.5 answer channel (thinking disabled in VL client).
  max_tokens: 128
  # Ring buffer for navigation-only frames (no semantic graph node; e.g. VLM fallback "object").
  navigation_samples_max: 256
  # Optional overrides:
  # system_prompt: "..."
  # user_suffix: "Focus on manipulable objects."

# When false, generic-label frames are dropped (no graph node, no navigation sample).
graph_eqa_record_navigation: true

# GraphEQA / Dynagraph: drop scene-inappropriate open-vocab labels at graph attach.
# Robocasa sessions auto-select ``kitchen`` (denies bathroom stall / toilet / … from ScanNet-200).
graph_eqa_label_filter:
  scene_profile: auto

# GraphEQA / Dynagraph: voxel frontiers mirrored as graph nodes for EQA prompts + nav.
graph_eqa_frontier_nodes:
  enabled: true
  max_nodes: 12
  min_cluster_cells: 3
  # Blend keyword overlap with time heuristic in voxel sample_exploration (higher = more question bias).
  keyword_score_weight: 2.0

# Dynagraph spatial merge + staleness (same as ``interactive`` in configs/benchmarks/dynagraph.yaml).
# ``emet run dynagraph`` applies these via setdefault when keys are missing.
dynagraph_merge_xy_m: 0.45
dynagraph_staleness_horizon: 256

# Live Rerun (``emet run dynamem``, ``emet run dynagraph``). See ``agents/default_rerun.yaml``.
rerun:
  mjcf_show_visual_mesh: true
  mjcf_show_skeleton: false
  server_memory_limit: "4GB"
  show_camera_point_clouds: false
  voxel_map_stride: 2
  dynagraph_stride: 2
  mjcf_mesh_stride: 3
  dynagraph:
    log_crops: false
    log_edges: false

# ``emet capture`` / ``emet stream`` terminal + loop defaults. See ``agents/default_stream.yaml``.
stream:
  verbose: false
  status_interval_s: 5.0
  da3_log_level: WARN
  log_every_step_when_max_steps_le: 20
  rerun_hold_s: 30.0
