# Pre-commit hooks for emet — see https://pre-commit.com
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3

repos:
  # General-purpose hooks (third_party excluded where relevant)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^third_party/
      - id: end-of-file-fixer
        exclude: ^third_party/
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^third_party/
      - id: check-ast
        exclude: ^third_party/
      - id: check-docstring-first
        exclude: ^third_party/

  # License header for Python files (project code only). Hello Robot header for legacy tree;
  # new modules listed below use docs/license_header_chris_paxton.txt (see second hook).
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.1.12
    hooks:
      - id: insert-license
        args: ["--license-file", "docs/license_header.txt"]
        types_or: [python]
        exclude: |
          (?x)^(
            third_party/|
            src/emet/controller/controller_dynagraph\.py|
            src/emet/utils/observation_layout\.py|
            src/emet/app/run_dynagraph\.py|
            src/emet/dev_system_packages\.py|
            src/emet/mapping/debug_navgrid_ascii\.py|
            src/emet/mapping/navgrid_compare\.py|
            src/emet/simulation/molmospaces_mobile_autoplace\.py|
            scripts/molmospaces_navgrid_smoke\.py|
            scripts/tier4_.*\.py|
            src/test/agent/test_dynagraph_import_cycle\.py|
            src/test/utils/test_observation_zmq_camera_layout\.py|
            src/test/core/test_parameters_setdefault\.py|
            src/test/mapping/test_debug_navgrid_ascii\.py|
            src/test/mapping/test_navgrid_compare\.py|
            src/test/molmospaces/test_multi_robot_molmospaces_navgrid_similarity\.py|
            src/test/molmospaces/test_stretch_molmospaces_dynamem_floor_map\.py|
            packages/emet_habitat/|
            src/emet/benchmarks/__init__\.py|
            src/emet/benchmarks/sqa3d/|
            src/emet/habitat/|
            src/test/benchmarks/sqa3d/|
            src/test/habitat/|
            src/emet/eval/benchmark_dynagraph\.py|
            src/emet/eval/memory_backends\.py|
            src/emet/llms/graph_eqa_vlm\.py|
            src/emet/llms/prompts/hmeqa_eqa_prompt\.py|
            src/emet/memory/graph_eqa/(frontier_nodes|mcq_debias|nav_benchmark|sim_ground_truth_graph)\.py|
            src/emet/simulation/(mujoco_ground_truth|mujoco_gt_objects|sim_object_placements)\.py|
            src/emet/app/(dynagraph_explore|eval_sqa3d|export_sim_gt|run_graph_eqa_habitat|run_interactive|tune_graph_fusion)\.py|
            src/test/molmospaces/test_xlerobot.*\.py|
            src/test/test_stretch_teleport_command\.py|
            src/test/(eval/test_benchmark_dynagraph|memory/test_(dynagraph_ground_truth.*|frontier_nodes|graph_eqa_human_answer|graph_nav_localize|mcq_debias|sim_ground_truth_graph|sim_object_placements)|app/test_(dynagraph_explore|dynagraph_nav_benchmark|run_interactive)|agent/test_vlm_frontier_scoring|core/test_zmq_ground_truth_action|simulation/test_mujoco_ground_truth)\.py|
            scripts/(aggregate_sqa3d_sweep|download_habitat_eqa_data|download_scannet_data|download_sqa3d_data|dynagraph_ground_truth_smoke|eval_dynagraph_ground_truth|probe_vlm_boxes|run_sqa3d_scannet_smoke|smoke_backend_localization_figure|smoke_vl_model)\.py|
            scripts/run_sqa3d_gpu_sweep\.sh|
            src/emet/app/config_cli\.py|
            src/emet/config/loader\.py|
            src/emet/config/runtime\.py|
            src/test/app/test_dynagraph_robocasa_question_cli\.py|
            src/test/app/test_stream_dynav_resolve\.py|
            src/test/config/test_emet_config_loader\.py|
            src/test/config/test_runtime_context\.py|
            src/test/eval/test_status_log\.py
          )
      - id: insert-license
        alias: insert-license-chris-paxton
        name: insert-license (Chris Paxton)
        args: ["--license-file", "docs/license_header_chris_paxton.txt"]
        types_or: [python]
        files: |
          (?x)^(
            src/emet/controller/controller_dynagraph\.py|
            src/emet/utils/observation_layout\.py|
            src/emet/app/run_dynagraph\.py|
            src/emet/dev_system_packages\.py|
            src/emet/mapping/debug_navgrid_ascii\.py|
            src/emet/mapping/navgrid_compare\.py|
            src/emet/simulation/molmospaces_mobile_autoplace\.py|
            scripts/molmospaces_navgrid_smoke\.py|
            scripts/tier4_.*\.py|
            src/test/agent/test_dynagraph_import_cycle\.py|
            src/test/utils/test_observation_zmq_camera_layout\.py|
            src/test/core/test_parameters_setdefault\.py|
            src/test/mapping/test_debug_navgrid_ascii\.py|
            src/test/mapping/test_navgrid_compare\.py|
            src/test/molmospaces/test_multi_robot_molmospaces_navgrid_similarity\.py|
            src/test/molmospaces/test_stretch_molmospaces_dynamem_floor_map\.py|
            packages/emet_habitat/|
            src/emet/benchmarks/__init__\.py|
            src/emet/benchmarks/sqa3d/|
            src/emet/habitat/|
            src/test/benchmarks/sqa3d/|
            src/test/habitat/|
            src/emet/eval/benchmark_dynagraph\.py|
            src/emet/eval/memory_backends\.py|
            src/emet/llms/graph_eqa_vlm\.py|
            src/emet/llms/prompts/hmeqa_eqa_prompt\.py|
            src/emet/memory/graph_eqa/(frontier_nodes|mcq_debias|nav_benchmark|sim_ground_truth_graph)\.py|
            src/emet/simulation/(mujoco_ground_truth|mujoco_gt_objects|sim_object_placements)\.py|
            src/emet/app/(dynagraph_explore|eval_sqa3d|export_sim_gt|run_graph_eqa_habitat|run_interactive|tune_graph_fusion)\.py|
            src/test/molmospaces/test_xlerobot.*\.py|
            src/test/test_stretch_teleport_command\.py|
            src/test/(eval/test_benchmark_dynagraph|memory/test_(dynagraph_ground_truth.*|frontier_nodes|graph_eqa_human_answer|graph_nav_localize|mcq_debias|sim_ground_truth_graph|sim_object_placements)|app/test_(dynagraph_explore|dynagraph_nav_benchmark|run_interactive)|agent/test_vlm_frontier_scoring|core/test_zmq_ground_truth_action|simulation/test_mujoco_ground_truth)\.py|
            scripts/(aggregate_sqa3d_sweep|download_habitat_eqa_data|download_scannet_data|download_sqa3d_data|dynagraph_ground_truth_smoke|eval_dynagraph_ground_truth|probe_vlm_boxes|run_sqa3d_scannet_smoke|smoke_backend_localization_figure|smoke_vl_model)\.py|
            scripts/run_sqa3d_gpu_sweep\.sh|
            src/emet/app/config_cli\.py|
            src/emet/config/loader\.py|
            src/emet/config/runtime\.py|
            src/test/app/test_dynagraph_robocasa_question_cli\.py|
            src/test/app/test_stream_dynav_resolve\.py|
            src/test/config/test_emet_config_loader\.py|
            src/test/config/test_runtime_context\.py|
            src/test/eval/test_status_log\.py
          )$

  # Ruff: lint + format (line-length 120, third_party excluded in pyproject.toml and here)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^third_party/
      - id: ruff-format
        exclude: ^third_party/

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        exclude: >
          (?x)^(
            src/emet/|
            src/emet_core/|
            src/stretch_ros2_bridge/|
            src/innate_mars_bridge/|
            third_party/|
            .*setup\.py$
          )
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --disable-error-code=override
          - --disable-error-code=attr-defined

  # Strip notebook outputs
  - repo: https://github.com/kynan/nbstripout
    rev: 0.6.1
    hooks:
      - id: nbstripout

  # Format shell scripts (project only). setuptools<74 required for pkg_resources used by beautysh
  - repo: https://github.com/lovesegfault/beautysh
    rev: v6.2.1
    hooks:
      - id: beautysh
        exclude: |
          (?x)^(
            third_party/|
            scripts/run_hmeqa_agentic_h2h\.sh
          )
        additional_dependencies: ["setuptools>=61,<74"]

  # Spell check (project only)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        args:
          - --ignore-words=.codespell-ignore-words.txt
        exclude: >
          (?x)^(
            third_party/|
            .*\.svg|
            .*\.tsv|
            ^src/test/audio/test_text_to_speech\.py
          )$
