# Pre-commit hooks for emet — see https://pre-commit.com
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3

repos:
  # General-purpose hooks (third_party excluded where relevant)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^third_party/
      - id: end-of-file-fixer
        exclude: ^third_party/
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^third_party/
      - id: check-ast
        exclude: ^third_party/
      - id: check-docstring-first
        exclude: ^third_party/

  # License header for Python files. Content-based, not a path list: files that already
  # declare a license (legacy Hello Robot headers, vendored SPDX notices) are left alone,
  # and anything else gets the Chris Paxton stub. See docs/copyright_headers.md.
  - repo: local
    hooks:
      - id: insert-license-header
        name: insert license header (Chris Paxton)
        entry: python3 scripts/insert_license_header.py --license-file docs/license_header_chris_paxton.txt
        language: system
        types_or: [python]
        exclude: |
          (?x)^(
            third_party/|
            scripts/scannet/|
            src/emet/simulation/molmo_occupancy/
          )

  # Ruff: lint + format (line-length 120, third_party excluded in pyproject.toml and here)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^third_party/
      - id: ruff-format
        exclude: ^third_party/

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        exclude: >
          (?x)^(
            src/emet/|
            src/emet_core/|
            src/stretch_ros2_bridge/|
            src/innate_mars_bridge/|
            third_party/|
            .*setup\.py$
          )
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --disable-error-code=override
          - --disable-error-code=attr-defined

  # Strip notebook outputs
  - repo: https://github.com/kynan/nbstripout
    rev: 0.6.1
    hooks:
      - id: nbstripout

  # Format shell scripts (project only). setuptools<74 required for pkg_resources used by beautysh
  - repo: https://github.com/lovesegfault/beautysh
    rev: v6.2.1
    hooks:
      - id: beautysh
        exclude: ^third_party/
        additional_dependencies: ["setuptools>=61,<74"]

  # Spell check (project only)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        args:
          - --ignore-words=.codespell-ignore-words.txt
        exclude: >
          (?x)^(
            third_party/|
            .*\.svg|
            .*\.tsv|
            ^src/test/audio/test_text_to_speech\.py
          )$
