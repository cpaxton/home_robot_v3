# Pre-commit hooks for emet — see https://pre-commit.com
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_language_version:
  python: python3

repos:
  # General-purpose hooks (third_party excluded where relevant)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^third_party/
      - id: end-of-file-fixer
        exclude: ^third_party/
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: ^third_party/
      - id: check-ast
        exclude: ^third_party/
      - id: check-docstring-first
        exclude: ^third_party/

  # License header for Python files (project code only)
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.1.12
    hooks:
      - id: insert-license
        args: ["--license-file", "docs/license_header.txt"]
        types_or: [python]
        exclude: ^third_party/

  # Ruff: lint + format (line-length 120, third_party excluded in pyproject.toml and here)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^third_party/
      - id: ruff-format
        exclude: ^third_party/

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        exclude: >
          (?x)^(
            src/emet/app/|
            src/stretch_ros2_bridge/|
            third_party/|
            src/emet/agent/|
            src/emet/perception/|
            src/emet/visualization/
          )
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --disable-error-code=override
          - --disable-error-code=attr-defined

  # Strip notebook outputs
  - repo: https://github.com/kynan/nbstripout
    rev: 0.6.1
    hooks:
      - id: nbstripout

  # Format shell scripts (project only)
  - repo: https://github.com/lovesegfault/beautysh
    rev: v6.2.1
    hooks:
      - id: beautysh
        exclude: ^third_party/

  # Spell check (project only)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        args:
          - --ignore-words=.codespell-ignore-words.txt
        exclude: >
          (?x)^(
            third_party/|
            .*\.svg|
            .*\.tsv|
            ^src/test/audio/test_text_to_speech\.py
          )$
